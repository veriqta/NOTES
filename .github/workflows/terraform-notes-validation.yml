name: Terraform handbook checks
on:
  pull_request:
    paths:
      - '8. Terraform-Portfolio-Projects/**'
      - '.github/workflows/terraform-notes-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Validate Terraform, mocked plans and local exercises
        working-directory: '8. Terraform-Portfolio-Projects'
        run: python3 scripts/validate.py
