apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkout
  namespace: veriqta-release
spec:
  ingressClassName: nginx
  rules:
  - host: checkout.veriqta.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: checkout-stable
            port:
              number: 8080
